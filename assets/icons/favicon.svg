<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8b3d"/>
      <stop offset="1" stop-color="#d4520e"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="#7a2d05" stroke-width="4"/>
  <!-- monster truck -->
  <g>
    <!-- body -->
    <rect x="30" y="42" width="68" height="26" rx="8" fill="#3b82f6" stroke="#1e3a8a" stroke-width="3"/>
    <!-- cab -->
    <rect x="60" y="28" width="28" height="20" rx="6" fill="#1e3a8a"/>
    <rect x="66" y="32" width="14" height="11" rx="3" fill="#bfe6f5"/>
    <!-- lightning decal -->
    <path d="M38 50 L52 50 L46 56 L56 56 L40 66 L46 58 L38 58 Z" fill="#ffd23f"/>
    <!-- axles -->
    <rect x="34" y="66" width="8" height="14" fill="#222"/>
    <rect x="86" y="66" width="8" height="14" fill="#222"/>
    <!-- wheels -->
    <circle cx="38" cy="88" r="18" fill="#1b1b1b"/>
    <circle cx="38" cy="88" r="8" fill="#555"/>
    <circle cx="90" cy="88" r="18" fill="#1b1b1b"/>
    <circle cx="90" cy="88" r="8" fill="#555"/>
    <!-- ground dust -->
    <circle cx="14" cy="102" r="5" fill="#ffd23f" opacity="0.7"/>
    <circle cx="114" cy="100" r="4" fill="#ffd23f" opacity="0.7"/>
  </g>
</svg>
